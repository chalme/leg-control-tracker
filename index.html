  <script>
"use strict";
const KEY = 'steady-step-v1';
const exercises = [
    { id: 'stepdown', name: '低台阶下踩', en: 'Step-down', tag: '膝关节动态控制', purpose: '练习髋、膝、踝在单腿承重时的协同。', dose: 8, unit: '次', sided: true, icon: 'step', steps: ['找一个固定、防滑的 5–10 cm 低台阶，站稳并靠近墙面。', '右脚站在台阶上，另一条腿从台阶外侧自然垂下。', '右膝用约 3 秒缓慢弯曲，让左脚跟轻触地面。', '用右腿控制站回原位；换左脚支撑重复。'], cues: ['骨盆尽量保持水平，允许轻扶墙面。', '膝盖沿自己舒适的脚尖方向弯曲，不强行扭正。', '下降平稳，比下得多低更重要。'], mistakes: ['下降过快或脚直接砸地', '身体明显侧倾、骨盆旋转', '结束时突然向后顶膝'], easier: '降低台阶高度，减小下降距离，单手扶墙。', warning: '出现疼痛、打软腿或明显关节卡住时停止。' },

function renderHistory() { const data = [...state.sessions].sort((a, b) => b.startTime.localeCompare(a.startTime)); const chartRows = data.filter(s => typeof s.discomfortAfter === 'number' && Number.isFinite(s.discomfortAfter)).slice(0, 12).reverse(); return `<div class="page"><div class="page-kicker">YOUR JOURNEY</div><h1 class="page-heading">训练记录</h1><p class="page-description">用完成情况和动作感受验证训练是否有帮助，而不是每天检查膝盖外形。</p><div class="stats"><div class="stat-card"><div><div class="stat-name">已记录训练</div><div class="stat-value">${data.length}<span>次</span></div></div></div><div class="stat-card"><div><div class="stat-name">完成组数</div><div class="stat-value">${data.reduce((sum, s) => sum + Object.values(s.exercises).reduce((a, x) => a + x.right + x.left + x.both, 0), 0)}<span>组</span></div></div></div><div class="stat-card"><div><div class="stat-name">最近一次 RPE</div><div class="stat-value">${data[0]?.rpe ?? '—'}<span>/10</span></div></div></div></div>${chartRows.length > 1 ? renderChart(chartRows) : `<div class="empty-state">至少记录两次训练后，这里会出现“不自然感”变化趋势。<br/>评分只表示主观感受，不用于诊断。</div>`}<div class="section-title-row"><h2 class="section-title">全部训练</h2><span class="muted">${data.length} 次记录</span></div>${data.length ? data.map(s => { const count = Object.values(s.exercises).reduce((v, e) => v + e.right + e.left + e.both, 0); return `<article class="history-card"><div class="history-head"><div><strong>${escapeHtml(s.date)} <span class="history-badge">${s.historical ? '历史补录' : '已保存'}</span></strong><small>${s.historical ? '由用户补录，未记录实际次数' : `约 ${s.durationMinutes} 分钟 · ${count} 组`}</small></div><button class="danger-btn" data-action="delete-session" data-id="${escapeHtml(s.id)}">删除</button></div><div class="history-metrics"><span>完成 ${count} 组</span><span>RPE ${s.rpe === null ? '未记' : `${s.rpe}/10`}</span><span>不自然感：${s.discomfortBefore ?? '未记'} → ${s.discomfortAfter ?? '未记'}</span></div>${s.comment ? `<div class="history-footer"><p class="small-info">${escapeHtml(s.comment)}</p></div>` : ''}</article>`; }).join('') : `<div class="empty-state"><strong>还没有训练记录</strong>完成第一次训练后，这里会显示组数、评分和备注。</div>`}</div>`; }
function renderChart(data) { const left = 40, top = 22, w = 520, h = 185; const count = data.length; const pt = (s, i) => `${left + (i / (count - 1)) * w},${top + h - (s.discomfortAfter ?? 0) / 10 * h}`; return `<div class="chart-card"><div class="section-title-row" style="margin-top:0"><h2 class="section-title">不自然感变化</h2><span class="muted">最近 ${count} 次</span></div><svg viewBox="0 0 600 250" role="img" aria-label="训练后不自然感趋势，分数越低表示主观不自然感越低"><g stroke="#e4ebe5" stroke-width="1">${[0, 5, 10].map(v => `<line x1="40" y1="${top + h - v / 10 * h}" x2="560" y2="${top + h - v / 10 * h}"/>`).join('')}</g><g fill="#889c8d" font-size="12">${[0, 5, 10].map(v => `<text x="12" y="${top + h - v / 10 * h + 4}">${v}</text>`).join('')}<text x="40" y="236">较早</text><text x="532" y="236">最近</text></g><polyline points="${data.map(pt).join(' ')}" fill="none" stroke="#337d60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${data.map((s, i) => `<circle cx="${left + i / (count - 1) * w}" cy="${top + h - (s.discomfortAfter ?? 0) / 10 * h}" r="5" fill="#337d60" stroke="white" stroke-width="2"><title>${escapeHtml(s.date)}: ${s.discomfortAfter ?? '—'}/10</title></circle>`).join('')}</svg><p class="small-info">0 = 没有不自然感，10 = 非常明显；这不是医疗检测指标。</p></div>`; }
function renderSettings() { return `<div class="page"><div class="page-kicker">YOUR DATA</div><h1 class="page-heading">计划与数据</h1><p class="page-description">无需注册账号。所有训练日志都保存在当前浏览器；不同设备不会自动同步。</p><div class="section-panel"><h2 class="section-title">训练设置</h2><div class="settings-row"><div><strong>计划开始日期</strong><p>四周训练阶段根据该日期自动计算；调整不会删除记录。</p></div><input type="date" id="planStart" value="${escapeHtml(state.startDate)}" /></div><div class="settings-row"><div><strong>四周阶段进度</strong><p>第一周默认每项 2 组；第二周起默认 3 组。实际完成量可自主修改。</p></div><span class="phase-pill">第 ${phase()} / 4 周</span></div><h2 class="section-title" style="margin-top:25px">数据管理</h2><div class="settings-row"><div><strong>导出训练记录</strong><p>保存完整 JSON 文件，可用于换手机、换浏览器后的备份。</p></div><button class="primary-btn" data-action="export">导出 JSON</button></div><div class="settings-row"><div><strong>导入历史数据</strong><p>从此网站导出的 JSON 恢复记录。导入会替换本机已有记录。</p></div><label class="outline-btn" for="importInput" style="cursor:pointer;white-space:nowrap">选择 JSON 文件</label><input type="file" id="importInput" accept="application/json,.json" style="display:none" /></div><div class="settings-row"><div><strong>清空本地训练数据</strong><p>此操作不可撤销，请先导出备份。</p></div><button class="danger-btn" data-action="reset">清空数据</button></div></div><div class="alert">隐私说明：本站没有账号、数据库、分析脚本或后端接口。训练数据仅存于此浏览器的 LocalStorage；浏览器清理数据或无痕模式可能导致记录丢失。公开网页并不意味着你的记录会公开。</div></div>`; }
function exportData() { const data = JSON.stringify(state, null, 2); const blob = new Blob([data], { type: 'application/json' }); const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = `稳步训练记录-${localDate(new Date())}.json`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('已准备 JSON 备份'); }
async function importData(file) { if (file.size > 2_000_000) {
    toast('文件过大，请检查是否为训练记录');
    return;
} try {
    const data = stateFromUnknown(JSON.parse(await file.text()));
    if (!data) {
        toast('导入失败：不是有效的训练记录');
        return;
    }
    if (!confirm('导入会替换本机现有训练记录。建议先导出备份。确认继续吗？'))
        return;
    state = data;
    store();
    render();
    toast(`导入成功，共 ${state.sessions.length} 条记录`);
}
catch {
    toast('导入失败，请检查 JSON 文件格式');
} }
function saveSession() { const w = state.working; if (!w)
    return; const c = setCount(w); if (c === 0) {
    toast('请先打卡至少一组训练');
    return;
} if (!confirm(`已完成 ${c}/${totalCount(w)} 组，确定保存本次训练吗？`))
    return; const endTime = new Date().toISOString(); const startMs = new Date(w.startTime).getTime(); const s = { id: `session-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date: localDate(new Date()), startTime: w.startTime, endTime, durationMinutes: Math.max(1, Math.round((Date.now() - startMs) / 60000)), exercises: Object.fromEntries(exercises.map(e => { const x = w.exercises[e.id]; const completed = (v) => v.filter(Boolean).length; return [e.id, { sets: x.sets, right: completed(x.right), left: completed(x.left), both: completed(x.both), dose: e.dose, unit: e.unit }]; })), rpe: w.rpe, discomfortBefore: w.discomfortBefore, discomfortAfter: w.discomfortAfter, comment: w.comment }; state.sessions.push(s); state.working = null; store(); currentTab = 'history'; render(); toast('本次训练已保存到本机'); }
function clickAction(e) { const target = e.target.closest('[data-action]'); if (!target)
    return; const action = target.dataset.action; const ex = target.dataset.ex || ''; if (action === 'tab') {
    currentTab = target.dataset.tab;
    location.hash = currentTab;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
} if (action === 'detail')
    showDetail(ex); if (action === 'close-modal')
    closeModal(); if (action === 'close-overlay' && e.target === target)
    closeModal(); if (action === 'start') {
    state.working = makeWorking();
    store();
    render();
} if (action === 'toggle-set' && state.working) {
    const working = state.working.exercises[ex];
    const side = target.dataset.side;
    const i = Number(target.dataset.index);
    if (!working || !['right', 'left', 'both'].includes(side) || !Number.isInteger(i) || i < 0 || i >= working.sets)
        return;
    working[side][i] = !working[side][i];
    store();
    render();
} if (action === 'change-sets' && state.working) {
    const working = state.working.exercises[ex];
    if (!working)
        return;
    const n = working.sets + Number(target.dataset.change);
    if (n < 1 || n > 6)
        return;
    working.sets = n;
    working.right.length = n;
    working.left.length = n;
    working.both.length = n;
    store();
    render();
} if (action === 'save-session')
    saveSession(); if (action === 'abandon-session') {
    if (confirm('放弃未保存的本次训练吗？')) {
        state.working = null;
        store();
        render();
    }
} if (action === 'export')
    exportData(); if (action === 'reset') {
    if (confirm('确定清空全部训练记录与进度吗？此操作不可恢复。')) {
        state = defaultState();
        store();
        render();
        toast('已清空本地数据');
    }
} if (action === 'delete-session') {
    const id = target.dataset.id;
    if (confirm('删除这条训练记录吗？')) {
        state.sessions = state.sessions.filter(s => s.id !== id);
        store();
        render();
        toast('已删除记录');
    }
} }
document.addEventListener('click', clickAction);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('modalRoot')?.children.length)
    closeModal(); });
document.addEventListener('input', e => { const el = e.target; const field = el.dataset.field; if (!field || !state.working)
    return; if (field === 'rpe' || field === 'discomfortBefore' || field === 'discomfortAfter') {
    const n = Number(el.value);
    if (Number.isFinite(n) && n >= 0 && n <= 10)
        state.working[field] = n;
    if (field === 'rpe') {
        const shown = document.getElementById('rpeNum');
        if (shown)
            shown.textContent = `${state.working.rpe}/10`;
    }
}
else if (field === 'comment') {
    state.working.comment = el.value.slice(0, 1000);
} store(); });
document.addEventListener('change', e => { const el = e.target; if (el.id === 'planStart' && isDate(el.value)) {
    state.startDate = el.value;
    store();
    render();
} if (el.id === 'importInput' && el.files?.[0])
    void importData(el.files[0]); });
const route = () => { const t = location.hash.replace(/^#/, ''); return t in PAGES ? t : 'today'; };
window.addEventListener('hashchange', () => { currentTab = route(); render(); });
currentTab = route();
render();

</script>
